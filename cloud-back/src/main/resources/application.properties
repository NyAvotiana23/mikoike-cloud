spring.application.name=ProjetFinal

# Base Postgres (locale)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/projet_cloud}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

# SQL Initialization - exécuter data.sql après Hibernate
spring.sql.init.mode=always
spring.sql.init.continue-on-error=${SQL_INIT_CONTINUE_ON_ERROR:false}

# Firebase Configuration
firebase.config.enabled=${FIREBASE_ENABLED:true}
# Chemin disque du compte de service (si vide : classpath firebase-service-account.json)
firebase.config.path=${FIREBASE_CREDENTIALS_PATH:}
firebase.config.file=firebase-service-account.json

# Paramètres custom
auth.max-attempts=3
session.expiry-minutes=30
auth.lockout-duration-minutes=30

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}

# Server Configuration
server.port=8002

admin.secret-key=${ADMIN_SECRET_KEY:}

# Logging
logging.level.mg.projetfinal=${LOG_LEVEL:INFO}
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN